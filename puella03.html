<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>田文江 · 像素作品集 | Pixel Portfolio</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Press+Start+2P&family=VT323&family=Silkscreen:wght@400;700&display=swap" />
  <style>
/* ========== Pixel Art Portfolio - Global Styles ========== */

:root {
  /* NES-inspired limited palette */
  --bg-dark: #0f0f23;
  --bg-darker: #080818;
  --bg-panel: #1a1a3e;
  --bg-panel-2: #252552;
  --border-light: #5c5cff;
  --border-dark: #2a2a6e;
  --text-primary: #ffffff;
  --text-secondary: #b8b8e0;
  --text-muted: #7a7ab0;

  /* Accent colors - limited palette */
  --accent-cyan: #00e0ff;
  --accent-pink: #ff4dc4;
  --accent-yellow: #ffe64d;
  --accent-green: #4dff88;
  --accent-orange: #ff994d;
  --accent-purple: #a855ff;

  /* Pixel sizes */
  --pixel: 4px;
  --pixel-2: 8px;
  --pixel-3: 12px;
  --pixel-4: 16px;

  /* Fonts */
  --font-display: 'Press Start 2P', 'Silkscreen', monospace;
  --font-body: 'VT323', 'Silkscreen', monospace;
  --font-ui: 'Silkscreen', 'VT323', monospace;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.6;
  color: var(--text-primary);
  background-color: var(--bg-dark);
  background-image:
    radial-gradient(ellipse at top, var(--bg-panel) 0%, transparent 50%),
    linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
  min-height: 100vh;
  overflow-x: hidden;
}

/* CRT Scanlines overlay */
#scanlines {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.12),
    rgba(0, 0, 0, 0.12) 1px,
    transparent 1px,
    transparent 2px
  );
  opacity: 0.4;
}

#root {
  position: relative;
  z-index: 1;
}

/* ========== Pixel Border System ========== */

.pixel-border {
  position: relative;
  border: 4px solid var(--border-light);
  background: var(--bg-panel);
  box-shadow:
    4px 4px 0 var(--border-dark),
    inset 2px 2px 0 rgba(255,255,255,0.1),
    inset -2px -2px 0 rgba(0,0,0,0.3);
}

.pixel-border-2 {
  position: relative;
  border: 3px solid var(--border-light);
  background: var(--bg-panel-2);
  box-shadow:
    3px 3px 0 var(--border-dark),
    inset 2px 2px 0 rgba(255,255,255,0.08),
    inset -2px -2px 0 rgba(0,0,0,0.25);
}

/* ========== Typography ========== */

.font-display {
  font-family: var(--font-display);
  letter-spacing: 0.5px;
}

.font-body {
  font-family: var(--font-body);
}

.font-ui {
  font-family: var(--font-ui);
}

/* ========== Navbar ========== */

.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: var(--bg-darker);
  border-bottom: 4px solid var(--accent-cyan);
  box-shadow:
    0 4px 0 var(--border-dark),
    0 8px 16px rgba(0,0,0,0.5);
}

.navbar-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.navbar-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--accent-cyan);
  font-family: var(--font-display);
  font-size: 12px;
  white-space: nowrap;
}

.navbar-logo .pixel-heart {
  width: 24px;
  height: 24px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 8px;
  list-style: none;
}

.nav-link {
  display: inline-block;
  padding: 8px 16px;
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 700;
  color: var(--text-secondary);
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: 1px;
  border: 2px solid transparent;
  transition: all 0.1s steps(2);
  cursor: pointer;
  background: transparent;
}

.nav-link:hover,
.nav-link.active {
  color: var(--accent-yellow);
  border-color: var(--accent-yellow);
  background: rgba(255, 230, 77, 0.1);
  transform: translate(-2px, -2px);
  box-shadow: 2px 2px 0 var(--accent-yellow);
}

.nav-link:active {
  transform: translate(0, 0);
  box-shadow: none;
}

/* Mobile hamburger */
.nav-toggle {
  display: none;
  width: 40px;
  height: 40px;
  background: var(--bg-panel);
  border: 2px solid var(--border-light);
  cursor: pointer;
  padding: 8px;
  flex-direction: column;
  justify-content: space-between;
}

.nav-toggle span {
  display: block;
  width: 100%;
  height: 3px;
  background: var(--accent-cyan);
  transition: all 0.2s steps(2);
}

/* ========== Sections ========== */

.section {
  padding: 100px 24px 60px;
  max-width: 1200px;
  margin: 0 auto;
}

.section-title {
  font-family: var(--font-display);
  font-size: 20px;
  color: var(--accent-cyan);
  margin-bottom: 32px;
  text-align: center;
  text-shadow:
    2px 2px 0 var(--border-dark),
    4px 4px 0 rgba(0,0,0,0.3);
  letter-spacing: 1px;
}

.section-title::before,
.section-title::after {
  content: '◆';
  display: inline-block;
  margin: 0 16px;
  color: var(--accent-pink);
  font-size: 14px;
  vertical-align: middle;
}

/* ========== About / Profile Section ========== */

.hero-banner {
  position: relative;
  background:
    linear-gradient(135deg, rgba(0,224,255,0.1), rgba(255,77,196,0.1)),
    var(--bg-panel);
  border: 4px solid var(--accent-cyan);
  box-shadow:
    4px 4px 0 var(--border-dark),
    0 0 30px rgba(0, 224, 255, 0.2),
    inset 2px 2px 0 rgba(255,255,255,0.1);
  padding: 40px;
  margin-bottom: 32px;
  overflow: hidden;
}

.hero-banner::before {
  content: '';
  position: absolute;
  top: -2px;
  left: -2px;
  right: -2px;
  bottom: -2px;
  border: 2px solid var(--accent-pink);
  pointer-events: none;
  opacity: 0.5;
}

.hero-name {
  font-family: var(--font-display);
  font-size: 28px;
  color: var(--accent-yellow);
  margin-bottom: 12px;
  text-shadow:
    3px 3px 0 var(--border-dark),
    6px 6px 0 rgba(0,0,0,0.3);
  letter-spacing: 2px;
}

.hero-title {
  font-family: var(--font-ui);
  font-size: 20px;
  color: var(--accent-cyan);
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.hero-tagline {
  font-family: var(--font-body);
  font-size: 18px;
  color: var(--text-secondary);
  max-width: 600px;
}

.blinking-cursor {
  display: inline-block;
  width: 12px;
  height: 18px;
  background: var(--accent-green);
  margin-left: 4px;
  vertical-align: text-bottom;
  animation: blink 1s steps(2) infinite;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

/* Hero Avatar + Content Layout */
.hero-content {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  padding-top: 4px;
}

.hero-avatar {
  position: relative;
  flex-shrink: 0;
  width: 52px;
  height: 52px;
  margin-top: 2px;
}

.hero-avatar-frame {
  width: 52px;
  height: 52px;
  border: 3px solid var(--accent-cyan);
  box-shadow:
    3px 3px 0 var(--accent-pink),
    6px 6px 0 var(--border-dark),
    inset 1px 1px 0 rgba(255,255,255,0.2);
  overflow: hidden;
  background: var(--bg-darker);
}

.hero-avatar-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
}

.hero-avatar-corner {
  position: absolute;
  width: 8px;
  height: 8px;
  background: var(--accent-yellow);
  box-shadow: 1px 1px 0 var(--border-dark);
}

.hero-avatar-corner.tl { top: -4px; left: -4px; }
.hero-avatar-corner.tr { top: -4px; right: -4px; }
.hero-avatar-corner.bl { bottom: -4px; left: -4px; }
.hero-avatar-corner.br { bottom: -4px; right: -4px; }

.hero-text {
  flex: 1;
  min-width: 0;
}

/* Info grid */
.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.info-card {
  background: var(--bg-panel-2);
  border: 3px solid var(--border-light);
  box-shadow: 3px 3px 0 var(--border-dark);
  padding: 16px;
  transition: transform 0.1s steps(2);
}

.info-card:hover {
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 var(--accent-cyan);
}

.info-card-label {
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.info-card-value {
  font-family: var(--font-body);
  font-size: 18px;
  color: var(--text-primary);
  word-break: break-all;
}

/* Skill bars */
.skills-section {
  margin-bottom: 32px;
}

.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}

.skill-item {
  background: var(--bg-panel-2);
  border: 3px solid var(--border-light);
  box-shadow: 3px 3px 0 var(--border-dark);
  padding: 16px;
}

.skill-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.skill-name {
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-cyan);
  letter-spacing: 1px;
}

.skill-level {
  font-family: var(--font-display);
  font-size: 10px;
  color: var(--accent-yellow);
}

.skill-bar {
  height: 16px;
  background: var(--bg-darker);
  border: 2px solid var(--border-dark);
  position: relative;
  overflow: hidden;
}

.skill-bar-fill {
  height: 100%;
  transition: width 1s steps(20);
  position: relative;
}

.skill-bar-fill::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: repeating-linear-gradient(
    90deg,
    transparent 0,
    transparent 8px,
    rgba(255,255,255,0.1) 8px,
    rgba(255,255,255,0.1) 16px
  );
}

/* Traits / tags */
.traits-section {
  margin-bottom: 32px;
}

.traits-title {
  font-family: var(--font-ui);
  font-size: 16px;
  font-weight: 700;
  color: var(--accent-pink);
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.pixel-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.pixel-tag {
  display: inline-block;
  padding: 6px 14px;
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 700;
  color: var(--bg-darker);
  background: var(--accent-green);
  border: 2px solid var(--bg-darker);
  box-shadow: 2px 2px 0 var(--border-dark);
  letter-spacing: 0.5px;
  transition: all 0.1s steps(2);
}

.pixel-tag:hover {
  transform: translate(-1px, -1px);
  box-shadow: 3px 3px 0 var(--border-dark);
}

.pixel-tag.tag-cyan { background: var(--accent-cyan); }
.pixel-tag.tag-pink { background: var(--accent-pink); color: #fff; }
.pixel-tag.tag-yellow { background: var(--accent-yellow); }
.pixel-tag.tag-orange { background: var(--accent-orange); }

/* Timeline / Work Experience */
.timeline-section {
  margin-bottom: 32px;
}

.timeline {
  position: relative;
  padding-left: 32px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 10px;
  top: 8px;
  bottom: 8px;
  width: 4px;
  background: var(--accent-cyan);
  box-shadow: 2px 0 0 var(--border-dark);
}

.timeline-item {
  position: relative;
  margin-bottom: 24px;
}

.timeline-item::before {
  content: '';
  position: absolute;
  left: -28px;
  top: 6px;
  width: 16px;
  height: 16px;
  background: var(--accent-yellow);
  border: 3px solid var(--border-light);
  box-shadow: 2px 2px 0 var(--border-dark);
}

.timeline-date {
  font-family: var(--font-display);
  font-size: 10px;
  color: var(--accent-pink);
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.timeline-company {
  font-family: var(--font-ui);
  font-size: 18px;
  font-weight: 700;
  color: var(--accent-cyan);
  margin-bottom: 2px;
}

.timeline-position {
  font-family: var(--font-body);
  font-size: 16px;
  color: var(--accent-yellow);
  margin-bottom: 8px;
}

.timeline-card {
  background: var(--bg-panel-2);
  border: 3px solid var(--border-light);
  box-shadow: 3px 3px 0 var(--border-dark);
  padding: 16px;
}

.timeline-subtitle {
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 700;
  color: var(--accent-green);
  margin: 10px 0 6px;
  letter-spacing: 0.5px;
}

.timeline-subtitle:first-child {
  margin-top: 0;
}

.timeline-list {
  list-style: none;
  padding: 0;
}

.timeline-list li {
  position: relative;
  padding-left: 18px;
  margin-bottom: 4px;
  font-family: var(--font-body);
  font-size: 16px;
  color: var(--text-secondary);
}

.timeline-list li::before {
  content: '▸';
  position: absolute;
  left: 0;
  color: var(--accent-cyan);
  font-size: 12px;
  top: 2px;
}

/* Education & Certificates row */
.dual-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 32px;
}

@media (max-width: 640px) {
  .dual-grid {
    grid-template-columns: 1fr;
  }
}

.education-card,
.certs-card {
  background: var(--bg-panel-2);
  border: 3px solid var(--border-light);
  box-shadow: 3px 3px 0 var(--border-dark);
  padding: 20px;
}

.card-title {
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--accent-purple);
  margin-bottom: 14px;
  letter-spacing: 1px;
}

.education-school {
  font-family: var(--font-ui);
  font-size: 17px;
  font-weight: 700;
  color: var(--accent-cyan);
  margin-bottom: 4px;
}

.education-degree {
  font-family: var(--font-body);
  font-size: 16px;
  color: var(--accent-yellow);
  margin-bottom: 4px;
}

.education-date {
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.education-desc {
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.5;
}

.cert-list {
  list-style: none;
  padding: 0;
}

.cert-list li {
  position: relative;
  padding-left: 22px;
  margin-bottom: 8px;
  font-family: var(--font-body);
  font-size: 16px;
  color: var(--text-secondary);
}

.cert-list li::before {
  content: '★';
  position: absolute;
  left: 0;
  color: var(--accent-yellow);
  font-size: 12px;
  top: 1px;
}

/* ========== Photo Gallery ========== */

.tabs-container {
  margin-bottom: 24px;
}

.pixel-tabs {
  display: flex;
  gap: 0;
  border: 3px solid var(--border-light);
  box-shadow: 3px 3px 0 var(--border-dark);
  overflow: hidden;
  flex-wrap: wrap;
}

.pixel-tab {
  flex: 1;
  min-width: 120px;
  padding: 12px 20px;
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 700;
  color: var(--text-secondary);
  background: var(--bg-panel-2);
  border: none;
  border-right: 3px solid var(--border-light);
  cursor: pointer;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all 0.1s steps(2);
}

.pixel-tab:last-child {
  border-right: none;
}

.pixel-tab:hover {
  color: var(--accent-cyan);
  background: var(--bg-panel);
}

.pixel-tab.active {
  color: var(--bg-darker);
  background: var(--accent-cyan);
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
}

.photo-card {
  position: relative;
  aspect-ratio: 1;
  border: 3px solid var(--border-light);
  box-shadow: 3px 3px 0 var(--border-dark);
  overflow: hidden;
  cursor: pointer;
  background: var(--bg-panel-2);
  transition: all 0.1s steps(2);
}

.photo-card:hover {
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 var(--accent-pink);
  border-color: var(--accent-pink);
}

.photo-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.2s steps(4);
}

.photo-card:hover img {
  transform: scale(1.05);
}

.photo-card-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  opacity: 0;
  transition: opacity 0.15s steps(3);
}

.photo-card:hover .photo-card-overlay {
  opacity: 1;
}

.photo-card-label {
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--accent-cyan);
  text-align: center;
}

/* ========== Video Gallery ========== */

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
}

.video-card {
  background: var(--bg-panel-2);
  border: 3px solid var(--border-light);
  box-shadow: 3px 3px 0 var(--border-dark);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.1s steps(2);
  display: flex;
  flex-direction: column;
}

.video-card:hover {
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 var(--accent-yellow);
  border-color: var(--accent-yellow);
}

.video-thumb {
  position: relative;
  aspect-ratio: 16 / 9;
  background: var(--bg-darker);
  overflow: hidden;
}

.video-thumb video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.play-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 0;
  height: 0;
  border-left: 24px solid var(--accent-yellow);
  border-top: 16px solid transparent;
  border-bottom: 16px solid transparent;
  filter: drop-shadow(2px 2px 0 var(--border-dark));
  transition: transform 0.1s steps(2);
}

.video-card:hover .play-icon {
  border-left-color: var(--accent-pink);
  transform: translate(-50%, -50%) scale(1.1);
}

.video-info {
  padding: 12px;
  border-top: 3px solid var(--border-dark);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-panel);
}

.video-title {
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.video-duration {
  font-family: var(--font-display);
  font-size: 9px;
  color: var(--accent-cyan);
}

/* Video expand / fullscreen buttons */
.video-expand-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 32px;
  height: 32px;
  background: var(--bg-darker);
  border: 2px solid var(--accent-yellow);
  box-shadow: 2px 2px 0 var(--border-dark);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent-yellow);
  opacity: 0;
  transition: all 0.1s steps(2);
  padding: 4px;
  z-index: 2;
}

.video-card:hover .video-expand-btn {
  opacity: 1;
}

.video-expand-btn:hover {
  background: var(--accent-yellow);
  color: var(--bg-darker);
  transform: translate(-1px, -1px);
  box-shadow: 3px 3px 0 var(--border-dark);
}

.video-info-expand {
  width: 26px;
  height: 26px;
  background: var(--bg-panel-2);
  border: 2px solid var(--accent-cyan);
  color: var(--accent-cyan);
  cursor: pointer;
  font-family: var(--font-display);
  font-size: 10px;

// Pixel Button
function PixelButton({ children, color = 'cyan', onClick, style = {}, className = '' }) {
  const colorMap = {
    cyan: { bg: '#00e0ff', shadow: '#0088aa' },
    pink: { bg: '#ff4dc4', shadow: '#aa2288' },
    yellow: { bg: '#ffe64d', shadow: '#aa9922' },
    green: { bg: '#4dff88', shadow: '#22aa55' },
  };
  const c = colorMap[color] || colorMap.cyan;
  return (
    <button
      onClick={onClick}
      className={`pixel-btn ${className}`}
      style={{
        padding: '10px 20px',
        fontFamily: "'Silkscreen', monospace",
        fontSize: '14px',
        fontWeight: 700,
        color: '#0f0f23',
        background: c.bg,
        border: '3px solid #0f0f23',
        boxShadow: `3px 3px 0 ${c.shadow}`,
        cursor: 'pointer',
        letterSpacing: '1px',
        textTransform: 'uppercase',
        transition: 'all 0.1s steps(2)',
        ...style,
      }}
      onMouseDown={(e) => {
        e.currentTarget.style.transform = 'translate(2px, 2px)';
        e.currentTarget.style.boxShadow = '1px 1px 0 ' + c.shadow;
      }}
      onMouseUp={(e) => {
        e.currentTarget.style.transform = 'translate(0, 0)';
        e.currentTarget.style.boxShadow = `3px 3px 0 ${c.shadow}`;
      }}
      onMouseLeave={(e) => {
        e.currentTarget.style.transform = 'translate(0, 0)';
        e.currentTarget.style.boxShadow = `3px 3px 0 ${c.shadow}`;
      }}
    >
      {children}
    </button>
  );
}

// Pixel Progress Bar component (reusable)
function PixelProgressBar({ value = 0, max = 100, color = '#00e0ff', label = '' }) {
  const percent = Math.min(100, Math.max(0, (value / max) * 100));
  return (
    <div>
      {label && (
        <div style={{
          fontFamily: "'Silkscreen', monospace",
          fontSize: '12px',
          fontWeight: 700,
          color: '#b8b8e0',
          marginBottom: '4px',
          letterSpacing: '0.5px',
        }}>
          {label}
        </div>
      )}
      <div style={{
        height: '14px',
        background: '#080818',
        border: '2px solid #2a2a6e',
        position: 'relative',
        overflow: 'hidden',
      }}>
        <div
          style={{
            height: '100%',
            width: percent + '%',
            background: color,
            position: 'relative',
            transition: 'width 1s steps(20)',
          }}
        >
          <div style={{
            position: 'absolute',
            top: 0,
            left: 0,
            right: 0,
            bottom: 0,
            background: 'repeating-linear-gradient(90deg, transparent 0, transparent 8px, rgba(255,255,255,0.15) 8px, rgba(255,255,255,0.15) 16px)',
          }} />
        </div>
      </div>
    </div>
  );
}

  <script type="text/babel">
/* ========== Lightbox Component ========== */

function Lightbox({ items, currentIndex, onClose, onPrev, onNext, type = 'image' }) {
  const videoRef = React.useRef(null);
  const containerRef = React.useRef(null);

  React.useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === 'Escape') {
        // 如果处于全屏状态，先退出全屏
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
          return;
        }
        onClose();
      }
      if (e.key === 'ArrowLeft') onPrev();
      if (e.key === 'ArrowRight') onNext();
      if (e.key === 'f' && type === 'video' && videoRef.current) {
        toggleFullscreen();
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    document.body.style.overflow = 'hidden';
    return () => {
      window.removeEventListener('keydown', handleKeyDown);
      document.body.style.overflow = '';
      // 关闭时暂停视频
      if (videoRef.current) {
        videoRef.current.pause();
      }
    };
  }, [onClose, onPrev, onNext, type]);

  // 切换视频时自动播放
  React.useEffect(() => {
    if (type === 'video' && videoRef.current) {
      videoRef.current.currentTime = 0;
      videoRef.current.play().catch(() => {});
    }
  }, [currentIndex, type]);

  const toggleFullscreen = () => {
    const el = containerRef.current || videoRef.current;
    if (!el) return;

    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    } else if (el.requestFullscreen) {
      el.requestFullscreen().catch(() => {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }
  };

  if (currentIndex < 0 || currentIndex >= items.length) return null;

  const item = items[currentIndex];
  const src = typeof item === 'string' ? item : (item.url || item.src || '');
  const caption = typeof item === 'string' ? `${currentIndex + 1} / ${items.length}` : (item.title || `${currentIndex + 1} / ${items.length}`);

  return (
    <div className="lightbox-overlay" onClick={onClose}>
      <div
        className={`lightbox-content lightbox-${type}`}
        ref={containerRef}
        onClick={(e) => e.stopPropagation()}
      >
        <button className="lightbox-close" onClick={onClose} aria-label="Close">
          ✕
        </button>

        {type === 'video' && (
          <button
            className="lightbox-fullscreen"
            onClick={toggleFullscreen}
            aria-label="全屏"
            title="全屏播放 (F键)"
          >
            <svg width="18" height="18" viewBox="0 0 16 16" style={{ imageRendering: 'pixelated', shapeRendering: 'crispEdges', display: 'block' }}>
              <rect x="0" y="0" width="5" height="2" fill="currentColor" />
              <rect x="0" y="0" width="2" height="5" fill="currentColor" />
              <rect x="11" y="0" width="5" height="2" fill="currentColor" />
              <rect x="14" y="0" width="2" height="5" fill="currentColor" />
              <rect x="0" y="14" width="5" height="2" fill="currentColor" />
              <rect x="0" y="11" width="2" height="5" fill="currentColor" />
              <rect x="11" y="14" width="5" height="2" fill="currentColor" />
              <rect x="14" y="11" width="2" height="5" fill="currentColor" />
            </svg>
          </button>
        )}

        {items.length > 1 && (
          <button
            className="lightbox-nav lightbox-prev"
            onClick={onPrev}
            aria-label="Previous"
          >
            ◀
          </button>
        )}

        {type === 'image' ? (
          <img src={src} alt={caption} />
        ) : (
          <video
            ref={videoRef}
            src={src}
            controls
            autoPlay
            playsInline
            className="lightbox-video"
          />
        )}

        {items.length > 1 && (
          <button
            className="lightbox-nav lightbox-next"
            onClick={onNext}
            aria-label="Next"
          >
            ▶
          </button>
        )}

        <div className="lightbox-caption">
          {caption} [{currentIndex + 1} / {items.length}]
          {type === 'video' && <span style={{ marginLeft: '12px', color: 'var(--text-muted)', fontSize: '12px' }}>按 F 全屏</span>}
        </div>
      </div>
    </div>
  );
}
  </script>

  const [lightboxIndex, setLightboxIndex] = React.useState(-1);

  const availableCount = VIDEO_LIST.filter((v) => !v.pending).length;

      if (!VIDEO_LIST[i].pending) return i;

    return start;

    setLightboxIndex((i) => findNextAvailable(i, 1));

/* ========== App - Main Entry ========== */

function App() {
  const [activeSection, setActiveSection] = React.useState('about');

  // Scroll spy
  React.useEffect(() => {
    const sections = ['about', 'photo', 'video'];

    const handleScroll = () => {
      const scrollPos = window.scrollY + 120;

      let current = 'about';
      for (const id of sections) {
        const el = document.getElementById(id);
        if (el && el.offsetTop <= scrollPos) {
          current = id;
        }
      }
      setActiveSection(current);
    };

    window.addEventListener('scroll', handleScroll, { passive: true });
    handleScroll();
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  const handleNavigate = (id) => {
    const el = document.getElementById(id);
    if (el) {
      const offset = 70;
      const top = el.offsetTop - offset;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  };

  return (
    <div>
      <Navbar activeSection={activeSection} onNavigate={handleNavigate} />
      <main>
        <About />
        <PhotoGallery />
        <VideoGallery />
      </main>
      <footer className="footer">
        <p className="footer-text">
          © 2024 田文江 · 像素风个人作品集
        </p>
        <p className="footer-signature">
          ◆ PIXEL PORTFOLIO · 8-BIT STYLE ◆
        </p>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
